# NOTE: This was written instead of pre-built actions such as aslafy-z/conventional-pr-title-action
# for improved speed (not using a container speeds up by ~30s per run)
name: This is for verifying pull request titles adhere to conventional commit format

on:
  workflow_call:
    inputs:
      WORKFLOW_NAME:
        description: 'DEPRECATED: unused, kept for consumer compatibility'
        required: false
        type: string
      # Default timeout for the job
      TIMEOUT:
        default: 15
        required: false
        type: number

jobs:
  # Single job named so the emitted context stays "<caller job> / Verify PR title job status"
  lint:
    name: Verify PR title job status
    timeout-minutes: ${{ inputs.TIMEOUT }}
    runs-on: ubuntu-slim
    steps:
      - name: Validate title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isPullRequest = context.eventName === 'pull_request';
            let title;
            let headSha;
            if (isPullRequest) {
              ({ title, head: { sha: headSha } } = context.payload.pull_request);
            } else {
              // merge_group: no PR payload — ref is gh-readonly-queue/<base>/pr-<N>-<sha>
              const match = process.env.GITHUB_REF_NAME.match(/pr-(\d+)-/);
              if (!match) {
                core.setFailed(`Cannot derive PR number from ref: ${process.env.GITHUB_REF_NAME}`);
                return;
              }
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(match[1]) });
              title = pr.title;
            }
            // Match title against conventional commit pattern
            const result = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\([\w\-\.]+\))?(!)?: ([\w ])+([\s\S]*)/.test(title);
            if (isPullRequest) {
              await github.request(
                'POST /repos/:owner/:repo/statuses/:sha',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: result ? 'success' : 'failure',
                  description: result ? 'Title is valid' : 'Title is not valid format', // must be less than 140 characters
                  sha: headSha,
                  target_url: 'https://residenetwork.atlassian.net/wiki/spaces/ENG/pages/1604878337/PR%2BTitle%2BCommit%2BMessage%2BStyle%2BGuide',
                  context: 'Valid PR title',
                },
              );
            }
            if (!result) {
              core.setFailed(`PR title is not valid conventional commit format: "${title}"`);
            }
