# Self-CI: this repo consuming its own claude-code reusable workflow.
# `claude-code.yml` used to be a consumer pointing at the INTERNAL workflow-templates, which this
# public repo cannot resolve (those runs were failing). It is now the reusable implementation, so
# the consumer lives here and calls it by local path — no dependency on the `v1` branch pointer.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: ./.github/workflows/claude-code.yml
    secrets: inherit
