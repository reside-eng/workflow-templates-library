name: Security (self)

# zizmor audit of this repository's own workflow and action files, on the files a PR changes.
on:
  pull_request:
    paths:
      - '.github/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  workflows-audit:
    name: workflows-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2

      - name: Unit tests (security-scan.py)
        run: python3 -m unittest discover -s .github/actions/security-scan/tests -v

      - name: Workflow audit
        uses: ./.github/actions/security-scan
        with:
          SCAN: workflows
          MODE_WORKFLOWS: ${{ vars.SECURITY_SCAN_WORKFLOWS || 'advisory' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULTS_BUCKET: ''
