# Self-CI: this repo consuming its own request-devops-review reusable workflow by local path.
# A consumer pointing at the INTERNAL workflow-templates would fail here (public repo).

name: Request DevOps Review

on:
  pull_request:
    paths:
      - '.github/**'
      - '.yarnrc.yml'
      - '.yarn/**'

jobs:
  request-devops-review:
    uses: ./.github/workflows/request-devops-review.yml
    secrets: inherit
