name: 'PR Analytics'
description: 'Records every pull request closed on the default branch, metadata only, in side-dw.github.pull_requests (AI v2 M1, PLAT-12247; revert facts and commit authors for the KR dashboard, M2, PLAT-12248). Copy of the workflow-templates action for the library release workflow (push to main): resolves the PRs merged by the pushed commit.'
inputs:
  CI_SERVICE_ACCOUNT:
    description: 'Service account key used for BigQuery access (LIBRARY_CI_SERVICE_ACCOUNT)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Collect pull request facts
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        ROW_JQ: ${{ github.action_path }}/row.jq
      run: |
        set -euo pipefail
        if [ -n "$EVENT_PR_NUMBER" ]; then
          numbers="$EVENT_PR_NUMBER"
          source=event
        else
          # push: closed PRs associated with the pushed commit (one for squash and merge commits)
          numbers=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.state == "closed") | .number' | sort -u)
          source=push
        fi
        if [ -z "$numbers" ]; then
          echo "No pull request associated with this event: nothing to record"
          echo "rows=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        : > "$RUNNER_TEMP/pr-rows.jsonl"
        for n in $numbers; do
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n")
          reviews=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$n/reviews" \
            --jq '[.[] | {login: .user.login, type: .user.type, state: .state, submitted_at: .submitted_at}]' | jq -cs 'add // []')
          # Commits per author (login and type only): tells a bot PR that carries a person's commits from one that does not
          commit_authors=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$n/commits?per_page=100" \
            --jq '[.[] | {login: (.author.login // null), type: (.author.type // "unknown")}]' \
            | jq -cs 'add // [] | group_by([.login, .type]) | map({login: .[0].login, type: .[0].type, commits: length})')
          # row.jq builds the row and derives the revert facts and the title type from the title and the body, which are not stored
          jq -cn -f "$ROW_JQ" --argjson pr "$pr" --argjson reviews "$reviews" --argjson commit_authors "$commit_authors" \
            --arg recorded_at "$recorded_at" --arg repository "$GITHUB_REPOSITORY" --arg source "$source" \
            --argjson run_id "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/pr-rows.jsonl"
        done
        echo "rows=$RUNNER_TEMP/pr-rows.jsonl" >> "$GITHUB_OUTPUT"
        jq -c '{number, author, merged, merged_at, labels, reviews: (.reviews | length), is_revert, reverts_numbers, title_type, commit_authors: (.commit_authors | length)}' "$RUNNER_TEMP/pr-rows.jsonl"

    - name: Cloud SDK Auth
      if: steps.collect.outputs.rows != ''
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: side-dw
        credentials_json: ${{ inputs.CI_SERVICE_ACCOUNT }}
        # The ci-analytics step that follows authenticates again in the same job
        cleanup_credentials: false

    - name: Insert into BigQuery
      if: steps.collect.outputs.rows != ''
      shell: bash
      env:
        ROWS_FILE: ${{ steps.collect.outputs.rows }}
      run: |
        set -euo pipefail
        gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
        ACCESS_TOKEN=$(gcloud auth print-access-token)
        jq -cs '{rows: [.[] | {insertId: (.repository + "-" + (.number | tostring) + "-" + .recorded_at), json: .}]}' "$ROWS_FILE" \
          > "$RUNNER_TEMP/pr-insert.json"
        response=$(curl -sS --retry 3 --retry-all-errors -X POST \
          -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
          'https://bigquery.googleapis.com/bigquery/v2/projects/side-dw/datasets/github/tables/pull_requests/insertAll' \
          --data-binary @"$RUNNER_TEMP/pr-insert.json")
        if jq -e '.insertErrors // .error' <<<"$response" >/dev/null; then
          echo "::warning::BigQuery insert into pull_requests failed: $response"
          exit 1
        fi
        echo "Recorded $(wc -l < "$ROWS_FILE" | tr -d ' ') pull request(s) in side-dw.github.pull_requests"
